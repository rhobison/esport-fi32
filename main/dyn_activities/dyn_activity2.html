<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dynamic Activity 2</title>
    <style>
        body {
            font-family: sans-serif;
            background: #e8f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1em;
            box-sizing: border-box;
            font-size: 1.2em;
            color: #333
        }

        h1 {
            font-size: 2em;
            margin-bottom: 0.3em
        }

        p {
            margin: 0.5em 0
        }

        button {
            font-size: 1.1em;
            padding: 0.6em 1.4em;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background: #4a90d9;
            color: #fff;
            margin-top: 1em
        }

        button:disabled {
            background: #aaa;
            cursor: default
        }

        .banner {
            margin-top: 1em;
            padding: 0.6em 1em;
            border-radius: 6px;
            font-weight: bold
        }

        .ok {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb
        }

        .err {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb
        }
    </style>
</head>

<body>
    <h1>Dynamic Activity 2</h1>
    <p id="credits-line">Available credits: --</p>
    <button id="claim-btn" onclick="claimCredits()">Claim Credits</button>
    <div id="banner" style="display:none"></div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var pin = params.get('pin') || '';
        var deviceIdx = parseInt(params.get('device_idx') || '0', 10);
        var actId = parseInt(params.get('act_id') || '0', 10);
        var creditsS = parseInt(params.get('credits_s') || '0', 10);
        var token = params.get('token') || '';

        function formatHMS(s) {
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var sec = s % 60;
            return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        document.getElementById('credits-line').textContent =
            'Available credits: ' + formatHMS(creditsS);

        function claimCredits() {
            var btn = document.getElementById('claim-btn');
            btn.disabled = true;
            fetch('/api/activities/credit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    device_idx: deviceIdx,
                    act_id: actId,
                    credits_s: creditsS,
                    completion_time_s: 0,
                    pin: pin,
                    token: token
                })
            }).then(function (r) {
                if (r.status === 429) {
                    showBanner('Daily limit reached \u2014 come back tomorrow!', false);
                    btn.disabled = false;
                    return null;
                }
                if (r.status === 403) {
                    showBanner('Not authorised \u2014 please go back and start the game again.', false);
                    return null;
                }
                if (!r.ok) {
                    showBanner('Error claiming credits (HTTP ' + r.status + ').', false);
                    btn.disabled = false;
                    return null;
                }
                return r.json();
            }).then(function (d) {
                if (!d) { return; }
                showBanner('Credits claimed! Counter: ' + d.new_counter_hms, true);
            }).catch(function () {
                showBanner('Network error claiming credits.', false);
                btn.disabled = false;
            });
        }

        function showBanner(msg, ok) {
            var div = document.getElementById('banner');
            div.textContent = msg;
            div.className = 'banner ' + (ok ? 'ok' : 'err');
            div.style.display = 'block';
        }
    </script>
</body>

</html>
