<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fish Math: Bubble Reef</title>
    <style>
        /* reset */
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #001428, #003d5c);
            font-family: sans-serif;
            color: #fff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden
        }

        #screen {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden
        }

        :root {
            font-size: 16px;
            --active-glow: #ff9a3c;
            --win-gold: #ff9a3c;
            --wrong-bord: #e03030;
            --ctrl-border: #0a2a3a
        }

        /* portrait: flex-col; landscape: flex-row */
        .game-col {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-width: 0;
            overflow: hidden
        }

        .control-col {
            display: flex;
            flex-direction: column;
            flex-shrink: 0
        }

        @media(orientation:landscape) {
            #screen {
                flex-direction: row
            }

            .control-col {
                width: 200px;
                border-left: 1px solid var(--ctrl-border);
                padding: 6px
            }
        }

        @media(orientation:portrait) {
            .control-col {
                width: 100%;
                border-top: 1px solid var(--ctrl-border);
                padding: 6px
            }
        }

        @media(max-width:400px) {
            :root {
                font-size: 13px
            }
        }

        @media(orientation:landscape)and(max-height:500px) {
            :root {
                font-size: 12px
            }
        }

        /* header */
        .header-bar {
            display: flex;
            align-items: center;
            gap: .5em;
            padding: .3em .6em;
            background: rgba(0, 10, 30, .8);
            flex-shrink: 0;
            flex-wrap: wrap
        }

        .header-title {
            font-weight: bold;
            font-size: 1em;
            margin-right: auto
        }

        .timer {
            font-size: 1.1em;
            font-variant-numeric: tabular-nums;
            min-width: 3.5em;
            text-align: right
        }

        .prog-wrap {
            flex: 1 1 60px;
            height: .7em;
            background: #012040;
            border-radius: .35em;
            overflow: hidden;
            min-width: 40px
        }

        .prog-bar {
            height: 100%;
            background: linear-gradient(90deg, #1db8d6, #ff9a3c);
            transition: width .3s;
            border-radius: .35em
        }

        /* game area */
        .game-area {
            position: relative;
            overflow: hidden;
            flex: 1 1 0;
            min-height: 0;
            background: linear-gradient(180deg, #001428 0%, #003d5c 60%, #004830 100%)
        }

        /* background rising bubble layers */
        .bub-layer {
            position: absolute;
            inset: 0;
            pointer-events: none
        }

        .bl1 {
            background-image: radial-gradient(circle, rgba(100, 210, 240, .25) 1.5px, transparent 1.5px);
            background-size: 55px 55px;
            animation: rise1 8s linear infinite
        }

        .bl2 {
            background-image: radial-gradient(circle, rgba(60, 180, 220, .18) 1px, transparent 1px);
            background-size: 90px 90px;
            animation: rise2 13s linear infinite
        }

        .bl3 {
            background-image: radial-gradient(circle, rgba(40, 150, 200, .15) 2px, transparent 2px);
            background-size: 130px 130px;
            animation: rise3 18s linear infinite
        }

        @keyframes rise1 {
            from {
                background-position: 0 0
            }

            to {
                background-position: 0 -55px
            }
        }

        @keyframes rise2 {
            from {
                background-position: 0 0
            }

            to {
                background-position: 0 -90px
            }
        }

        @keyframes rise3 {
            from {
                background-position: 0 0
            }

            to {
                background-position: 0 -130px
            }
        }

        /* sea floor */
        .sea-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 18px;
            background: linear-gradient(#3a2e14, #6a5428);
            border-radius: 50% 50% 0 0 / 14px 14px 0 0
        }

        /* seaweed */
        .seaweed {
            position: absolute;
            bottom: 16px;
            width: 8px;
            background: #1a6b3a;
            border-radius: 4px 4px 0 0;
            transform-origin: bottom center
        }

        .sw1 {
            left: 8%;
            height: 36px;
            animation: sway 3.1s ease-in-out infinite alternate
        }

        .sw2 {
            left: 17%;
            height: 28px;
            animation: sway 2.7s ease-in-out .4s infinite alternate
        }

        .sw3 {
            left: 50%;
            height: 30px;
            animation: sway 3.2s ease-in-out .1s infinite alternate
        }

        .sw4 {
            left: 75%;
            height: 32px;
            animation: sway 3.4s ease-in-out .2s infinite alternate
        }

        .sw5 {
            left: 84%;
            height: 24px;
            animation: sway 2.9s ease-in-out .7s infinite alternate
        }

        @keyframes sway {
            from {
                transform: rotate(-8deg)
            }

            to {
                transform: rotate(8deg)
            }
        }

        /* clown fish character */
        .fish-char {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            animation: swim 2s ease-in-out infinite
        }

        @keyframes swim {

            0%,
            100% {
                transform: translateX(-50%) translateY(0)
            }

            50% {
                transform: translateX(-50%) translateY(-6px)
            }
        }

        .fish-char.happy {
            animation: fishHappy .4s ease forwards
        }

        @keyframes fishHappy {
            0% {
                transform: translateX(-50%) translateY(0) scale(1)
            }

            50% {
                transform: translateX(-50%) translateY(-14px) scale(1.12)
            }

            100% {
                transform: translateX(-50%) translateY(0) scale(1)
            }
        }

        .fish-char.wrong {
            animation: fishWrong .35s ease forwards
        }

        @keyframes fishWrong {

            0%,
            100% {
                transform: translateX(-50%)
            }

            25% {
                transform: translateX(calc(-50% - 8px))
            }

            75% {
                transform: translateX(calc(-50% + 8px))
            }
        }

        /* game bubbles */
        .bubble {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(180, 240, 255, .85), rgba(20, 100, 180, .65));
            border: 2px solid rgba(150, 230, 255, .7);
            font-size: .95em;
            font-weight: bold;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 80, .8);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 6px 2px rgba(40, 140, 200, .5)
        }

        .bubble.active {
            animation: bubblePulse 1s ease-in-out infinite alternate
        }

        @keyframes bubblePulse {
            from {
                box-shadow: 0 0 8px 4px var(--active-glow)
            }

            to {
                box-shadow: 0 0 20px 8px var(--active-glow)
            }
        }

        .bubble.wrong {
            animation: bubbleWobble .3s ease forwards
        }

        @keyframes bubbleWobble {

            0%,
            100% {
                transform: translateX(0);
                border-color: rgba(150, 230, 255, .7)
            }

            25% {
                transform: translateX(-6px);
                border-color: var(--wrong-bord)
            }

            75% {
                transform: translateX(6px);
                border-color: var(--wrong-bord)
            }
        }

        .pop {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            pointer-events: none;
            animation: bubblePop .4s ease-out forwards
        }

        .pop.escape {
            animation: bubbleEscape .3s ease-out forwards
        }

        @keyframes bubblePop {
            0% {
                background: radial-gradient(circle, #fff 0%, rgba(100, 220, 255, .8) 40%, transparent 70%);
                opacity: 1;
                transform: scale(1)
            }

            100% {
                opacity: 0;
                transform: scale(2.5)
            }
        }

        @keyframes bubbleEscape {
            0% {
                background: radial-gradient(circle, rgba(100, 200, 255, .5) 0%, transparent 70%);
                opacity: .7;
                transform: scale(1) translateY(0)
            }

            100% {
                opacity: 0;
                transform: scale(1.5) translateY(-20px)
            }
        }

        /* stats */
        .stats-bar {
            display: flex;
            gap: 1.2em;
            padding: .3em .6em;
            font-size: .9em;
            background: rgba(0, 10, 30, .6);
            flex-shrink: 0
        }

        /* control col internals */
        .input-row {
            display: flex;
            gap: .4em;
            align-items: center;
            padding: .3em 0
        }

        .answer-display {
            flex: 1;
            min-width: 0;
            background: #011828;
            border: 2px solid #1db8d6;
            border-radius: 4px;
            font-size: 1.3em;
            text-align: center;
            padding: .2em;
            letter-spacing: .1em;
            min-height: 1.8em
        }

        .ok-btn {
            padding: .4em .8em;
            font-size: 1.1em;
            background: #1db8d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            min-width: 48px;
            min-height: 48px
        }

        .ok-btn:active {
            background: #1498b8
        }

        /* keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: .2em 0
        }

        .kbtn {
            min-height: 48px;
            font-size: 1.1em;
            background: #012040;
            color: #fff;
            border: 1px solid #0a3a5a;
            border-radius: 4px;
            cursor: pointer;
            user-select: none
        }

        .kbtn:active {
            background: #023060
        }

        .kbtn.bksp {
            grid-column: 3
        }

        /* end / error screens */
        .end-screen,
        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            padding: 1em;
            background: linear-gradient(180deg, #001428, #003d5c)
        }

        .win-screen {
            animation: reefBurst 2.5s ease infinite alternate
        }

        @keyframes reefBurst {
            from {
                background: linear-gradient(180deg, #001428, #003d5c)
            }

            to {
                background: linear-gradient(180deg, #002840, #005a3a)
            }
        }

        .end-screen h1 {
            font-size: 2em;
            margin-bottom: .5em
        }

        .win-title {
            color: var(--win-gold);
            text-shadow: 0 0 20px var(--win-gold)
        }

        .end-screen .stat {
            font-size: 1.1em;
            margin: .3em 0
        }

        .end-screen .bonus {
            color: var(--win-gold);
            font-size: 1.2em
        }

        .back-link {
            display: inline-block;
            margin-top: .8em;
            color: #1db8d6;
            text-decoration: none
        }

        .banner {
            margin-top: .8em;
            padding: .5em 1em;
            border-radius: 4px;
            font-size: .95em;
            max-width: 340px
        }

        .banner.ok {
            background: #1a5c2e;
            border: 1px solid #27ae60
        }

        .banner.err {
            background: #5c1a1a;
            border: 1px solid #cc0000
        }

        .banner.warn {
            background: #5c4a00;
            border: 1px solid #e6a800
        }

        .claiming {
            font-size: .95em;
            color: #7dd4f0;
            margin-top: .8em
        }

        .retry-btn {
            margin-top: .5em;
            padding: .35em .9em;
            font-size: .95em;
            background: #1db8d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer
        }

        .error-screen p {
            max-width: 320px;
            line-height: 1.5
        }

        .error-screen .back-link {
            margin-top: 1em
        }

        /* setup screen */
        .setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            padding: 1.5em;
            gap: 1em;
            background: linear-gradient(180deg, #001428, #003d5c)
        }

        .setup-screen h1 {
            font-size: 1.8em;
            color: var(--win-gold);
            text-shadow: 0 0 16px var(--win-gold)
        }

        .setup-screen p {
            font-size: 1em;
            color: #7dd4f0;
            margin: 0
        }

        .setup-opts {
            display: flex;
            flex-direction: column;
            gap: .9em;
            align-items: flex-start;
            margin: .3em 0
        }

        .setup-opt {
            display: flex;
            align-items: center;
            gap: .7em;
            font-size: 1.1em;
            cursor: pointer;
            user-select: none
        }

        .setup-opt input[type=checkbox] {
            width: 26px;
            height: 26px;
            cursor: pointer;
            accent-color: #1db8d6
        }

        .start-btn {
            margin-top: .5em;
            padding: .6em 2em;
            font-size: 1.2em;
            background: #1db8d6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            min-height: 48px
        }

        .start-btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .start-btn:not(:disabled):active {
            background: #1498b8
        }
    </style>
</head>

<body>
    <div id="screen"></div>
    <script>
        /* ---- constants ---- */
        const SECS_PER_PROBLEM = 5;
        const EARN_FRACTION = 0.70;
        const MAX_BUBBLES = 3;
        const SPEED_TIERS = [
            { upTo: 5, riseS: 12 },
            { upTo: 10, riseS: 11 },
            { upTo: 20, riseS: 10 },
            { upTo: Infinity, riseS: 9 }
        ];

        /* ---- url params ---- */
        const _p = new URLSearchParams(location.search);
        const pin = _p.get('pin') || '';
        const deviceIdx = parseInt(_p.get('device_idx') || '0', 10);
        const actId = parseInt(_p.get('act_id') || '0', 10);
        const creditsS = parseInt(_p.get('credits_s') || '0', 10);
        const timeLimitS = parseInt(_p.get('time_limit_s') || '0', 10);
        const token = _p.get('token') || '';

        /* ---- state ---- */
        let gameState = 'loading';
        let selectedTypes = ['mul', 'add', 'sub'];
        let targetProblems = 3;
        let solved = 0, wrong = 0, elapsedS = 0;
        let timeRemaining = 0;
        let bubbles = [];
        let activeBubbleId = null;
        let bubbleIdCounter = 0;
        let totalSolvedEver = 0;
        let recentProblems = [];
        let rafId = null, tickId = null;
        let lastRafTime = null;
        let gameAreaH = 0;
        let answerText = '';
        let fishHappyTimer = null, fishWrongTimer = null;

        /* ---- inline SVG clown fish ---- */
        const FISH_SVG =
            '<svg viewBox="0 0 110 65" width="88" height="52" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><clipPath id="bc"><ellipse cx="50" cy="35" rx="42" ry="26"/></clipPath></defs>' +
            /* tail fin */
            '<path d="M88,35 L110,18 L110,52Z" fill="#e65800" stroke="#1a0000" stroke-width="1.5" stroke-linejoin="round"/>' +
            /* body fill */
            '<ellipse cx="50" cy="35" rx="42" ry="26" fill="#ff6a00"/>' +
            /* white stripes clipped to body */
            '<g clip-path="url(#bc)">' +
            '<rect x="24" y="9"  width="14" height="52" rx="7" fill="#fff" stroke="#1a0000" stroke-width="1"/>' +
            '<rect x="48" y="9"  width="14" height="52" rx="7" fill="#fff" stroke="#1a0000" stroke-width="1"/>' +
            '<rect x="70" y="12" width="12" height="46" rx="6" fill="#fff" stroke="#1a0000" stroke-width="1"/>' +
            '</g>' +
            /* body outline on top */
            '<ellipse cx="50" cy="35" rx="42" ry="26" fill="none" stroke="#1a0000" stroke-width="1.5"/>' +
            /* pectoral fin */
            '<ellipse cx="40" cy="55" rx="12" ry="6" fill="#ff8c3a" stroke="#1a0000" stroke-width="1" transform="rotate(-20,40,55)"/>' +
            /* dorsal fin */
            '<path d="M28,10 Q46,2 65,10" fill="none" stroke="#e65800" stroke-width="5" stroke-linecap="round"/>' +
            /* eye: sclera, iris, pupil, specular */
            '<circle cx="18" cy="30" r="9"   fill="#fff"    stroke="#1a0000" stroke-width="1"/>' +
            '<circle cx="19" cy="30" r="5.5" fill="#1a6a00"/>' +
            '<circle cx="18" cy="29" r="3"   fill="#000"/>' +
            '<circle cx="17" cy="28" r="1.2" fill="#fff"/>' +
            /* smile */
            '<path d="M10,40 Q18,46 26,40" fill="none" stroke="#1a0000" stroke-width="1.5" stroke-linecap="round"/>' +
            '</svg>';

        /* ---- problem generator ---- */
        function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

        function generateProblem() {
            let prob, attempt = 0;
            do {
                const t = selectedTypes[Math.floor(Math.random() * selectedTypes.length)];
                let q, ans;
                if (t === 'add') {
                    const a = rand(1, 49), b = rand(1, 49 - a + 1);
                    q = a + '+' + b; ans = a + b;
                } else if (t === 'sub') {
                    const a = rand(10, 99), b = rand(1, a - 1);
                    q = a + '-' + b; ans = a - b;
                } else {
                    const a = rand(1, 9), b = rand(1, 9);
                    q = a + 'x' + b; ans = a * b;
                }
                prob = { question: q + '=?', answer: ans };
                attempt++;
            } while (attempt < 20 && recentProblems.includes(prob.question));
            recentProblems.push(prob.question);
            if (recentProblems.length > 10) recentProblems.shift();
            return prob;
        }

        /* ---- rise duration ---- */
        function riseDuration() {
            const n = totalSolvedEver + 1;
            for (const t of SPEED_TIERS) { if (n <= t.upTo) return t.riseS; }
            return 9;
        }

        /* Minimum horizontal separation between bubbles (percent). */
        const BUBBLE_MIN_SEP_PCT = 24;

        function pickLeftPct() {
            const occupied = bubbles.map(b => b.leftPct);
            for (let attempt = 0; attempt < 15; attempt++) {
                const left = rand(5, 72);
                if (occupied.every(x => Math.abs(x - left) >= BUBBLE_MIN_SEP_PCT)) return left;
            }
            const slots = [8, 36, 64];
            for (const s of slots) {
                if (occupied.every(x => Math.abs(x - s) >= BUBBLE_MIN_SEP_PCT)) return s;
            }
            return rand(5, 72);
        }

        /* ---- fish reactions ---- */
        function triggerFishHappy() {
            const fish = document.getElementById('fish-char');
            if (!fish) return;
            if (fishHappyTimer) clearTimeout(fishHappyTimer);
            if (fishWrongTimer) clearTimeout(fishWrongTimer);
            fish.classList.remove('wrong', 'happy');
            void fish.offsetWidth; /* reflow to restart animation */
            fish.classList.add('happy');
            fishHappyTimer = setTimeout(() => { fish.classList.remove('happy'); fishHappyTimer = null; }, 420);
        }

        function triggerFishWrong() {
            const fish = document.getElementById('fish-char');
            if (!fish) return;
            if (fishHappyTimer) clearTimeout(fishHappyTimer);
            if (fishWrongTimer) clearTimeout(fishWrongTimer);
            fish.classList.remove('wrong', 'happy');
            void fish.offsetWidth;
            fish.classList.add('wrong');
            fishWrongTimer = setTimeout(() => { fish.classList.remove('wrong'); fishWrongTimer = null; }, 360);
        }

        /* ---- bubble lifecycle ---- */
        function spawnBubble() {
            if (bubbles.length >= MAX_BUBBLES || gameState !== 'playing') return;
            const prob = generateProblem();
            const id = ++bubbleIdCounter;
            const left = pickLeftPct();
            const dur = riseDuration();
            const area = document.getElementById('game-area');
            const h = area ? area.clientHeight : 400;
            bubbles.push({ id, prob, leftPct: left, topPx: h + 10, dur });
            renderBubbleEl(bubbles[bubbles.length - 1]);
            refreshActiveBubble();
        }

        function renderBubbleEl(b) {
            const area = document.getElementById('game-area');
            if (!area) return;
            const el = document.createElement('div');
            el.className = 'bubble';
            el.id = 'bubble-' + b.id;
            el.style.left = b.leftPct + '%';
            el.style.top = b.topPx + 'px';
            el.textContent = b.prob.question;
            el.addEventListener('click', () => {
                if (gameState === 'playing') {
                    answerText = '';
                    updateAnswerDisplay();
                    setActiveBubble(b.id);
                }
            });
            area.appendChild(el);
        }

        function setActiveBubble(id) {
            if (id === activeBubbleId) return;
            if (activeBubbleId) {
                const old = document.getElementById('bubble-' + activeBubbleId);
                if (old) old.classList.remove('active');
            }
            activeBubbleId = id;
            if (activeBubbleId) {
                const el = document.getElementById('bubble-' + activeBubbleId);
                if (el) el.classList.add('active');
            }
        }

        function refreshActiveBubble() {
            if (activeBubbleId && bubbles.some(b => b.id === activeBubbleId)) return;
            /* Auto-select the bubble closest to escaping (smallest topPx). */
            let best = null, bestTop = Infinity;
            for (const b of bubbles) {
                if (b.topPx < bestTop) { bestTop = b.topPx; best = b; }
            }
            setActiveBubble(best ? best.id : null);
        }

        function destroyBubble(id, correct) {
            const idx = bubbles.findIndex(b => b.id === id);
            if (idx < 0) return;
            bubbles.splice(idx, 1);

            const el = document.getElementById('bubble-' + id);
            if (el) {
                const pop = document.createElement('div');
                pop.className = correct ? 'pop' : 'pop escape';
                pop.style.left = el.style.left;
                pop.style.top = el.style.top;
                el.parentNode.appendChild(pop);
                el.remove();
                setTimeout(() => pop.remove(), 420);
            }

            if (id === activeBubbleId) activeBubbleId = null;
            refreshActiveBubble();
            updateHUD();
            if (gameState === 'playing') spawnBubblesIfNeeded();
        }

        function spawnBubblesIfNeeded() {
            const need = MAX_BUBBLES - bubbles.length;
            for (let i = 0; i < need; i++) {
                if (i === 0) spawnBubble();
                else setTimeout(spawnBubble, i * 800);
            }
        }

        /* ---- RAF loop — bubbles move upward ---- */
        function rafLoop(now) {
            if (gameState !== 'playing') return;
            rafId = requestAnimationFrame(rafLoop);
            const area = document.getElementById('game-area');
            if (!area) return;
            gameAreaH = area.clientHeight;

            const dt = lastRafTime ? (now - lastRafTime) / 1000 : 0;
            lastRafTime = now;

            const toRemove = [];
            for (const b of bubbles) {
                b.topPx -= (gameAreaH + 70) * dt / b.dur;
                const el = document.getElementById('bubble-' + b.id);
                if (el) el.style.top = b.topPx + 'px';
                if (b.topPx <= -70) toRemove.push(b.id);
            }
            for (const id of toRemove) destroyBubble(id, false);
        }

        /* ---- input ---- */
        function appendDigit(d) {
            if (answerText.length >= 2) return;
            answerText += d;
            updateAnswerDisplay();
        }

        function backspace() {
            if (answerText.length > 0) { answerText = answerText.slice(0, -1); updateAnswerDisplay(); }
        }

        function submitAnswer() {
            if (!activeBubbleId || answerText === '') return;
            const b = bubbles.find(x => x.id === activeBubbleId);
            if (!b) return;
            const guess = parseInt(answerText, 10);
            answerText = '';
            updateAnswerDisplay();
            if (guess === b.prob.answer) {
                solved++;
                totalSolvedEver++;
                triggerFishHappy();
                destroyBubble(b.id, true);
                updateHUD();
                if (solved >= targetProblems) { endGame(true); return; }
            } else {
                wrong++;
                timeRemaining = Math.max(0, timeRemaining - 1);
                triggerFishWrong();
                const el = document.getElementById('bubble-' + b.id);
                if (el) {
                    el.classList.add('wrong');
                    setTimeout(() => el && el.classList.remove('wrong'), 320);
                }
                updateHUD();
            }
        }

        function updateAnswerDisplay() {
            const el = document.getElementById('answer-display');
            if (el) el.textContent = answerText || '\u00a0';
        }

        /* ---- timer ---- */
        function onTick() {
            if (gameState !== 'playing') return;
            elapsedS++;
            timeRemaining = Math.max(0, timeRemaining - 1);
            updateHUD();
            if (timeRemaining <= 0) endGame(false);
        }

        function updateHUD() {
            const tEl = document.getElementById('hud-timer');
            if (tEl) {
                const m = Math.floor(timeRemaining / 60);
                const s = timeRemaining % 60;
                tEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }
            const pbar = document.getElementById('hud-progbar');
            if (pbar) {
                const pct = Math.min(100, Math.round(solved / targetProblems * 100));
                pbar.style.width = pct + '%';
            }
            const solEl = document.getElementById('hud-solved');
            if (solEl) solEl.textContent = 'Popped: ' + solved + ' / ' + targetProblems;
            const wrEl = document.getElementById('hud-wrong');
            if (wrEl) wrEl.textContent = 'Wrong: ' + wrong;
        }

        /* ---- screens ---- */
        function formatHMS(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        function renderError(msg) {
            document.getElementById('screen').innerHTML =
                '<div class="error-screen"><p>' + msg + '</p>' +
                '<a class="back-link" href="/dyn">\u2190 Back to Games</a></div>';
        }

        function renderSetup() {
            gameState = 'setup';
            document.getElementById('screen').innerHTML =
                '<div class="setup-screen">' +
                '<h1>&#x1F420; Fish Math</h1>' +
                '<p>Choose which types of problems to include:</p>' +
                '<div class="setup-opts">' +
                '<label class="setup-opt"><input type="checkbox" id="chk-mul" checked> Table multiplication</label>' +
                '<label class="setup-opt"><input type="checkbox" id="chk-add" checked> Addition</label>' +
                '<label class="setup-opt"><input type="checkbox" id="chk-sub" checked> Subtraction</label>' +
                '</div>' +
                '<button class="start-btn" id="start-btn">Start Game!</button>' +
                '</div>';
            const updateBtn = () => {
                const any = document.getElementById('chk-mul').checked ||
                    document.getElementById('chk-add').checked ||
                    document.getElementById('chk-sub').checked;
                document.getElementById('start-btn').disabled = !any;
            };
            ['chk-mul', 'chk-add', 'chk-sub'].forEach(id => {
                document.getElementById(id).addEventListener('change', updateBtn);
            });
            document.getElementById('start-btn').addEventListener('click', () => {
                selectedTypes = [];
                if (document.getElementById('chk-mul').checked) selectedTypes.push('mul');
                if (document.getElementById('chk-add').checked) selectedTypes.push('add');
                if (document.getElementById('chk-sub').checked) selectedTypes.push('sub');
                startGame();
            });
        }

        function renderPlaying() {
            document.getElementById('screen').innerHTML =
                '<div class="game-col">' +
                '<div class="header-bar">' +
                '<span class="header-title">&#x1F420; Fish Math</span>' +
                '<span class="timer" id="hud-timer">--:--</span>' +
                '<div class="prog-wrap"><div class="prog-bar" id="hud-progbar" style="width:0%"></div></div>' +
                '</div>' +
                '<div class="game-area" id="game-area">' +
                '<div class="bub-layer bl1"></div>' +
                '<div class="bub-layer bl2"></div>' +
                '<div class="bub-layer bl3"></div>' +
                '<div class="sea-floor"></div>' +
                '<div class="seaweed sw1"></div>' +
                '<div class="seaweed sw2"></div>' +
                '<div class="seaweed sw3"></div>' +
                '<div class="seaweed sw4"></div>' +
                '<div class="seaweed sw5"></div>' +
                '<div class="fish-char" id="fish-char">' + FISH_SVG + '</div>' +
                '</div>' +
                '<div class="stats-bar">' +
                '<span id="hud-solved">Popped: 0 / ' + targetProblems + '</span>' +
                '<span id="hud-wrong">Wrong: 0</span>' +
                '</div>' +
                '</div>' +
                '<div class="control-col">' +
                '<div class="input-row">' +
                '<div class="answer-display" id="answer-display">\u00a0</div>' +
                '<button class="ok-btn" id="ok-btn">OK</button>' +
                '</div>' +
                '<div class="keypad" id="keypad">' +
                '<button class="kbtn" data-d="1">1</button>' +
                '<button class="kbtn" data-d="2">2</button>' +
                '<button class="kbtn" data-d="3">3</button>' +
                '<button class="kbtn" data-d="4">4</button>' +
                '<button class="kbtn" data-d="5">5</button>' +
                '<button class="kbtn" data-d="6">6</button>' +
                '<button class="kbtn" data-d="7">7</button>' +
                '<button class="kbtn" data-d="8">8</button>' +
                '<button class="kbtn" data-d="9">9</button>' +
                '<button class="kbtn" data-d="0" style="grid-column:1">0</button>' +
                '<button class="kbtn bksp" id="bksp-btn">\u232b</button>' +
                '</div>' +
                '</div>';

            document.getElementById('ok-btn').addEventListener('click', submitAnswer);
            document.getElementById('bksp-btn').addEventListener('click', backspace);
            document.getElementById('keypad').addEventListener('click', e => {
                const d = e.target.dataset.d;
                if (d !== undefined) appendDigit(d);
            });

            updateHUD();
        }

        function renderEnd(win) {
            stopGame();
            const earned = Math.floor(creditsS * solved / targetProblems);
            const submitCredit = Math.min(earned, creditsS);
            const bonus = Math.max(0, solved - targetProblems);

            let html = '<div class="end-screen ' + (win ? 'win-screen' : '') + '">';
            if (win) {
                html += '<h1 class="win-title">\ud83d\udc20 AMAZING!</h1>';
                html += '<p class="stat">You helped Nemo! \ud83d\udc20</p>';
                html += '<p class="stat">You popped <b>' + solved + ' / ' + targetProblems + '</b> bubbles</p>';
                if (bonus > 0) {
                    html += '<p class="bonus">(+' + bonus + ' BONUS bubble' + (bonus > 1 ? 's' : '') + '! \ud83c\udfc6)</p>';
                }
            } else {
                html += '<h1>\u23f1 TIME\'S UP!</h1>';
                html += '<p class="stat">You popped <b>' + solved + ' / ' + targetProblems + '</b> bubbles</p>';
            }
            html += '<p class="stat">Credits earned: <b>' + formatHMS(submitCredit) + '</b></p>';
            html += '<div id="banner-area"><p class="claiming">Saving your credits\u2026</p></div>';
            html += '<a class="back-link" href="/dyn">\u2190 Back to Games</a>';
            html += '</div>';

            document.getElementById('screen').innerHTML = html;
            /* Auto-submit — no button required. */
            claimCredits(submitCredit);
        }

        /* ---- credit claim ---- */
        function claimCredits(submitCredit) {
            fetch('/api/activities/credit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    device_idx: deviceIdx,
                    act_id: actId,
                    credits_s: submitCredit,
                    completion_time_s: elapsedS,
                    pin: pin,
                    token: token
                })
            }).then(r => {
                if (r.ok) return r.json().then(d => showBanner('ok', '\ud83c\udf89 Credits added! Counter: ' + (d.new_counter_hms || '')));
                if (r.status === 403) { showBanner('err', '\u26d4 Not authorised \u2014 please go back and start a new game.'); return; }
                if (r.status === 429) { showBanner('warn', '\u23f0 Daily limit reached \u2014 come back tomorrow!'); return; }
                showBannerRetry('Network error (HTTP ' + r.status + ') \u2014', submitCredit);
            }).catch(() => {
                showBannerRetry('Network error \u2014', submitCredit);
            });
        }

        function showBanner(type, msg) {
            const area = document.getElementById('banner-area');
            if (area) area.innerHTML = '<div class="banner ' + type + '">' + msg + '</div>';
        }

        function showBannerRetry(msg, submitCredit) {
            const area = document.getElementById('banner-area');
            if (!area) return;
            area.innerHTML = '<div class="banner err">' + msg + ' please try again.' +
                '<br><button class="retry-btn" id="retry-btn">Try again</button></div>';
            document.getElementById('retry-btn').addEventListener('click', () => {
                area.innerHTML = '<p class="claiming">Saving your credits\u2026</p>';
                claimCredits(submitCredit);
            });
        }

        /* ---- end game ---- */
        function endGame(win) {
            gameState = 'end';
            renderEnd(win);
        }

        function stopGame() {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (tickId) { clearInterval(tickId); tickId = null; }
            if (fishHappyTimer) { clearTimeout(fishHappyTimer); fishHappyTimer = null; }
            if (fishWrongTimer) { clearTimeout(fishWrongTimer); fishWrongTimer = null; }
        }

        /* ---- keyboard ---- */
        document.addEventListener('keydown', e => {
            if (gameState !== 'playing') return;
            if (e.key >= '0' && e.key <= '9') { appendDigit(e.key); e.preventDefault(); }
            else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
            else if (e.key === 'Enter') { submitAnswer(); e.preventDefault(); }
        });

        /* ---- init ---- */
        function startGame() {
            targetProblems = Math.max(3, Math.floor(timeLimitS * EARN_FRACTION / SECS_PER_PROBLEM));
            timeRemaining = timeLimitS;
            solved = 0; wrong = 0; elapsedS = 0; answerText = '';
            bubbles = []; activeBubbleId = null; bubbleIdCounter = 0;
            totalSolvedEver = 0; recentProblems = []; lastRafTime = null;
            gameState = 'playing';

            renderPlaying();

            /* Stagger first 3 bubbles so each appears ~1/3 of the screen height apart. */
            spawnBubble();
            setTimeout(spawnBubble, 4000);
            setTimeout(spawnBubble, 8000);

            rafId = requestAnimationFrame(rafLoop);
            tickId = setInterval(onTick, 1000);
        }

        (function init() {
            const missing = [];
            if (!pin) missing.push('pin');
            if (!token) missing.push('token');
            if (!actId) missing.push('act_id');
            if (!creditsS) missing.push('credits_s');
            if (!timeLimitS) missing.push('time_limit_s');
            if (!_p.has('device_idx')) missing.push('device_idx');
            if (missing.length > 0) {
                renderError('Oops! Missing game parameters (' + missing.join(', ') + '). Please go back to the games page.');
                return;
            }
            renderSetup();
        })();
    </script>
</body>

</html>
